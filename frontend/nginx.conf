# Serve static assets and route fallback; AWS edge verification is still a release gate.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Never turn a missing compiled asset into the SPA document.
    location ^~ /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
